name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Clippy mongodb
        run: cargo clippy --features mongodb --locked -- -D warnings

      - name: Test mongodb
        run: cargo test --features mongodb --locked

  check-serve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: serve

      - name: Install capnpc
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Clippy serve
        run: cargo clippy --locked --features serve -- -D warnings

      - name: Test serve
        run: cargo test --locked --features serve

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Install capnpc
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: MSRV check
        run: cargo check --locked

      - name: MSRV check serve
        run: cargo check --locked --features serve

      - name: MSRV check mongodb
        run: cargo check --locked --features mongodb
